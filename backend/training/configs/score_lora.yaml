model_name: Qwen/Qwen3-1.7B
task_name: score
train_file: data/essay_processed/score_train.jsonl
eval_file: data/essay_processed/score_eval.jsonl
output_dir: models/score-lora
max_seq_length: 2048
per_device_train_batch_size: 1
per_device_eval_batch_size: 1
gradient_accumulation_steps: 16
learning_rate: 2.0e-4
num_train_epochs: 5
warmup_ratio: 0.05
logging_steps: 20
save_strategy: epoch
evaluation_strategy: epoch
save_total_limit: 2
max_train_samples:
max_eval_samples:
lora_r: 16
lora_alpha: 32
lora_dropout: 0.1
target_modules:
  - q_proj
  - k_proj
  - v_proj
  - o_proj
  - gate_proj
  - up_proj
  - down_proj
